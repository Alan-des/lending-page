    <meta property="og:type" content="website">
    <meta property="og:title" content="Джавід Біньятов — Психолог/Консультант">
    <meta property="og:description" content="Архітектор душі. Ваша нова реальність починається там, де ви дозволяєте собі мати те, про що раніше боялися навіть подумати.">
    <meta property="og:image" content="img/IMG_8340.PNG">

    <script>
        const savedLang = localStorage.getItem('selectedLang');
        
        if (savedLang === 'ua') {
            window.location.replace('/page/ua/');
        } else if (savedLang === 'ru') {
            window.location.replace('/page/ru/');
        } else {
            const browserLang = navigator.language || navigator.userLanguage;
            if (browserLang.toLowerCase().includes('uk') || browserLang.toLowerCase().includes('ua')) {
                window.location.replace('/page/ua/');
            } else {
                window.location.replace('/page/ru/');
            }
        }
    </script>
</head>
